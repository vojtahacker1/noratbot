```yaml
name: NoratBot

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: noratbot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --silent

      - name: Generate configuration
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          BOT_TRUSTED_KEY: ${{ secrets.BOT_TRUSTED_KEY }}
          BOT_ADMIN_KEY: ${{ secrets.BOT_ADMIN_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          test -f config.example.json

          : "${DISCORD_TOKEN:?Missing DISCORD_TOKEN}"
          : "${BOT_TRUSTED_KEY:?Missing BOT_TRUSTED_KEY}"
          : "${BOT_ADMIN_KEY:?Missing BOT_ADMIN_KEY}"

          # Generate a random username.
          RANDOM_USERNAME="norat_$(openssl rand -hex 12)"

          jq \
            --arg token "$DISCORD_TOKEN" \
            --arg trusted "$BOT_TRUSTED_KEY" \
            --arg admin "$BOT_ADMIN_KEY" \
            --arg random_username "$RANDOM_USERNAME" \
            '
            .discord.token = $token |
            .bot.trustedKey = $trusted |
            .bot.adminKey = $admin |
            if .bot.username == "random"
            then .bot.username = $random_username
            else .
            end
            ' config.example.json > config.json.tmp

          mv config.json.tmp config.json

      - name: Run bot with automatic crash recovery
        shell: bash
        run: |
          set -euo pipefail

          RUN_WINDOW_SECONDS=14100
          RESTART_DELAY=10

          deadline=$((SECONDS + RUN_WINDOW_SECONDS))

          while (( SECONDS < deadline )); do
            remaining=$((deadline - SECONDS))

            set +e
            timeout \
              --signal=INT \
              --kill-after=15s \
              "${remaining}s" \
              node index.js >/dev/null 2>&1

            exit_code=$?
            set -e

            if (( SECONDS >= deadline )); then
              break
            fi

            sleep "$RESTART_DELAY"
          done

      - name: Commit and push bot changes
        id: persist
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote set-url origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"

          touch .gitignore

          for entry in "/config.json" "/config.json.tmp" "/node_modules/"; do
            if ! grep -Fxq "$entry" .gitignore; then
              echo "$entry" >> .gitignore
            fi
          done

          git rm -r --cached --ignore-unmatch -- \
            config.json config.json.tmp node_modules

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git -c core.hooksPath=/dev/null commit \
              -m "chore: persist bot data"

            AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"

            git -c http.extraheader="$AUTH_HEADER" \
              push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Automatically start next session
        if: steps.persist.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          WORKFLOW_ID="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows" \
            --jq '[.workflows[] | select(.name == "NoratBot" and .state == "active")] | first | .id')"

          if [[ -z "$WORKFLOW_ID" || "$WORKFLOW_ID" == "null" ]]; then
            exit 1
          fi

          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_ID}/dispatches" \
            -f ref="$GITHUB_REF_NAME"
```
